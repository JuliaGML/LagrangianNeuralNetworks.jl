# The gate for `scripts/`, in its own workflow rather than as a second job in CI.yml.
#
# CI.yml is byte-identical in every repository of the tree; a repository that needs an extra job
# gets an extra file, never a local edit to CI.yml.
#
# WHY THIS EXISTS.
#
# The package's own suite never loads a file from `scripts/`, so a script that stops running would
# do so in silence. This job runs every one of them.
#
# WHAT IT RUNS.
#
# `scripts/runscripts.jl` runs every `.jl` file under `reproduction/`, each in its own process, with
# LNN_SMOKE set, which is what `utilities/smoke.jl` reads to return the small size of every constant
# that costs time. A smoke run proves that the script still executes end to end; it says nothing
# about the result. The package has no `verification/` scripts, so that mode is not run.
#
# One entry, not a matrix: this job asks whether the scripts still run, and that question does not
# have a different answer on a second operating system.
#
# Deliberately not a required status check: its name does not begin with `Julia `, and the required
# list of `harness ci-protection` is static across the tree.

name: Scripts

on:
    push:
        branches:
            - main
            - master
        tags: ["*"]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    scripts:
        name: Scripts - ubuntu-latest
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            # julia-actions/cache proactively deletes the caches it created.
            actions: write
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: julia-actions/setup-julia@v3
              with:
                  version: "1"
            - uses: julia-actions/cache@v3
            - name: Instantiate the scripts environment
              # `scripts/Project.toml` reaches the package through `[sources] = {path = ".."}`, so
              # `Pkg.develop` is neither needed nor wanted here: it would write a machine-local
              # absolute path into that table.
              run: julia --startup-file=no --project=scripts -e 'using Pkg; Pkg.instantiate()'
            - name: Reproduction scripts, smoke sizes
              run: julia --startup-file=no --project=scripts scripts/runscripts.jl reproduction
